databases:
  - name: estoquepro-db
    databaseName: estoquepro
    user: estoquepro

services:
  - type: web
    name: estoquepro-app
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/primeiro-acesso/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estoquepro-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ENABLE_PUBLIC_FIRST_ACCESS
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "true"
